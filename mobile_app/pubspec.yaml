name: bss_gateway_monitor
description: BSS IoT Gateway BLE Monitor — ESP32-S3
publish_to: 'none'
version: 1.6.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.15
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.2
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0b1220"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: false

flutter_native_splash:
  color: "#0b1220"
  image: "assets/splash.png"
  android_12:
    color: "#0b1220"
    image: "assets/app_icon_foreground.png"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/splash.png

  # Bundled so text renders identically on every handset. A bare
  # fontFamily: 'monospace' is a request the OEM answers however it likes.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
